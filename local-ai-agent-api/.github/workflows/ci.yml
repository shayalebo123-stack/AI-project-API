name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Unit tests use in-memory fakes - no LocalStack or Docker needed here
      - name: Run tests
        run: mvn -B test

      - name: Build jar
        run: mvn -B package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-agent-jar
          path: target/local-ai-agent.jar

      - name: Build Docker image
        run: docker build -t local-ai-agent-api:${{ github.sha }} .
